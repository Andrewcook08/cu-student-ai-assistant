[project]
name = "course-search-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "neo4j>=5.0",
    "shared",
    "slowapi>=0.1,<0.2",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../../shared"
