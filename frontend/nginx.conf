# Main nginx config — copied to /etc/nginx/nginx.conf in the Dockerfile.
#
# Runs as the non-root `nginx` user on Cloud Run, so pid and temp paths
# must point at a writable location (/tmp/nginx, created in the Dockerfile).
# Placing these at the main-config level is a hard nginx requirement — they
# cannot live inside an included conf.d/ file.

pid /tmp/nginx/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Cloud Run upstreams speak HTTPS with SNI; the backend URLs are the
    # service URLs printed by `gcloud run services list` and are stable for
    # the project.
    proxy_ssl_server_name on;

    # WebSocket upgrade helper — `$connection_upgrade` resolves to "upgrade"
    # when the client requested an upgrade and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # /api/chat/* — more specific than /api/, so matched first regardless
        # of file order. WebSocket upgrade headers included for /api/chat/ws.
        location /api/chat/ {
            proxy_pass https://chat-service-d76hvr6ama-uc.a.run.app;
            proxy_set_header Host chat-service-d76hvr6ama-uc.a.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass https://course-search-api-d76hvr6ama-uc.a.run.app;
            proxy_set_header Host course-search-api-d76hvr6ama-uc.a.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
