[project]
name = "cu-student-ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "shared",
    "services/course-search-api",
    "services/chat-service",
    "data",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["scripts/", "data/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses Depends() in function signatures as a DI idiom — not a real
# mutable-default-argument bug. Suppress B008 for the standard FastAPI helpers.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/course-search-api/tests", "services/chat-service/tests", "data/ingest/tests"]
# Use importlib mode so multiple tests/conftest.py files across services don't
# collide on the same module name. Under the default "prepend" mode, every
# services/*/tests/conftest.py would be registered as plain `conftest`, and the
# second one to load would crash with "Plugin already registered under a
# different name". Importlib mode imports test files by file path, giving each
# conftest a unique synthetic module name. The application packages themselves
# (`chat_service`, `course_search_api`) have distinct names by construction, so
# they coexist in sys.modules without any extra help.
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: tests that require live infrastructure (Redis, Postgres, Neo4j, Ollama). Opt-in via `pytest -m integration`. Skipped in the default test run.",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "shared"
exclude = ["^scripts/", "^data/", "^frontend/", "^services/"]
